$kind: http-request
url: "{{baseUrl}}/products/{{productId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200 OK", () => pm.response.to.have.status(200));
      pm.test("ID corresponde ao produto criado", () => {
        pm.expect(String(pm.response.json().id)).to.eql(pm.collectionVariables.get("productId"));
      });
    language: text/javascript
order: 3000
