$kind: http-request
url: "{{baseUrl}}/products/{{productId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Produto Teste Atualizado",
      "description": "Descrição atualizada",
      "price": 59.9,
      "stockQuantity": 7,
      "isActive": true
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200 OK", () => pm.response.to.have.status(200));
      const data = pm.response.json();
      pm.test("Dados foram atualizados", () => {
        pm.expect(data.name).to.eql("Produto Teste Atualizado");
        pm.expect(data.price).to.eql(59.9);
        pm.expect(data.stockQuantity).to.eql(7);
      });
    language: text/javascript
order: 4000
