$kind: http-request
url: "{{baseUrl}}/products"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Produto Teste API",
      "description": "Criado pelo Postman",
      "price": 49.9,
      "stockQuantity": 10,
      "isActive": true
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 201 Created", () => pm.response.to.have.status(201));
      const data = pm.response.json();
      pm.test("Retorna produto com campos principais", () => {
        pm.expect(data).to.have.property("id");
        pm.expect(data.name).to.eql("Produto Teste API");
        pm.expect(data.price).to.eql(49.9);
        pm.expect(data.stockQuantity).to.eql(10);
      });
      if (data.id !== undefined) pm.collectionVariables.set("productId", String(data.id));
    language: text/javascript
order: 1000
