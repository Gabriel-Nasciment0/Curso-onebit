$kind: http-request
url: "{{baseUrl}}/api/groups/{{groupId}}/leads?page=1&pageSize=10"
method: GET
queryParams:
  page: "1"
  pageSize: "10"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Lista lead associado e paginação', function () {
          pm.response.to.have.status(200);
          const result = pm.response.json();
          pm.expect(result.leads.some((lead) => lead.id === Number(pm.collectionVariables.get('leadId')))).to.eql(true);
          pm.expect(result.meta.total).to.be.at.least(1);
      });
    language: text/javascript
order: 13000
