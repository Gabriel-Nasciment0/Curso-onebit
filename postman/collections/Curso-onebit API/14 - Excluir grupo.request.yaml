$kind: http-request
url: "{{baseUrl}}/api/groups/{{groupId}}"
method: DELETE
scripts:
  - type: afterResponse
    code: |-
      pm.test('Exclui grupo', function () {
          pm.response.to.have.status(200);
          pm.expect(pm.response.json().deletedGroup.id).to.eql(Number(pm.collectionVariables.get('groupId')));
      });
    language: text/javascript
order: 15000
