$kind: http-request
url: "{{baseUrl}}/api/campaigns/{{campaignId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Retorna a campanha criada', function () {
          pm.response.to.have.status(200);
          pm.expect(pm.response.json().id).to.eql(Number(pm.collectionVariables.get('campaignId')));
      });
    language: text/javascript
order: 18000
