$kind: http-request
url: "{{baseUrl}}/api/campaigns/{{campaignId}}/leads/{{leadId}}"
method: DELETE
scripts:
  - type: afterResponse
    code: |-
      pm.test('Remove associação lead-campanha', function () {
          pm.response.to.have.status(200);
          const result = pm.response.json();
          pm.expect(result.removedLead).to.include({
              campaignId: Number(pm.collectionVariables.get('campaignId')),
              leadId: Number(pm.collectionVariables.get('leadId'))
          });
      });
    language: text/javascript
order: 24000
