$kind: http-request
url: "{{baseUrl}}/api/campaigns/{{campaignId}}/leads?page=1&pageSize=10&status=Engaged"
method: GET
queryParams:
  page: "1"
  pageSize: "10"
  status: Engaged
scripts:
  - type: afterResponse
    code: |-
      pm.test('Filtra por status sem perder o filtro de campanha', function () {
          pm.response.to.have.status(200);
          const result = pm.response.json();
          pm.expect(result.meta.total).to.eql(1);
          pm.expect(result.leads[0].campaigns.some((item) => item.campaignId === Number(pm.collectionVariables.get('campaignId')) && item.status === 'Engaged')).to.eql(true);
      });
    language: text/javascript
order: 23000
