$kind: http-request
url: "{{baseUrl}}/customers"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "",
      "email": "cliente.invalido@example.com"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 400 Bad Request", () => pm.response.to.have.status(400));
      pm.test("Retorna mensagem de erro", () => pm.expect(pm.response.json()).to.have.property("error"));
    language: text/javascript
order: 5000
